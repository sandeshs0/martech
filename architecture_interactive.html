<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MarTech AI — System Architecture</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2e;
      --border: #232d48;
      --cyan: #38bdf8;
      --purple: #c084fc;
      --green: #4ade80;
      --amber: #fbbf24;
      --pink: #f472b6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 28px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: var(--muted);
      margin-top: 0;
      margin-bottom: 40px;
      font-size: 15px;
    }
    .diagram-container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    svg {
      width: 100%;
      height: auto;
    }
    .node-box {
      rx: 10;
      ry: 10;
      stroke-width: 2;
      transition: all 0.3s ease;
    }
    .node-title {
      font-weight: 700;
      font-size: 14px;
      fill: #ffffff;
    }
    .node-desc {
      font-size: 11px;
      fill: var(--muted);
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>MarTech AI — System Architecture</h1>
  <p class="subtitle">Multi-Agent State Graph Orchestration with Autonomous Feedback Loop</p>

  <div class="diagram-container">
    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e293b"/>
          <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>
        <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
        </marker>
        <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
        </marker>
      </defs>

      <!-- Input Stage -->
      <g transform="translate(40, 250)">
        <rect x="0" y="0" width="140" height="70" class="node-box" fill="#1e293b" stroke="#38bdf8" />
        <text x="15" y="30" class="node-title">Campaign Brief</text>
        <text x="15" y="50" class="node-desc">User Goal & Rules</text>
      </g>
      
      <line x1="180" y1="285" x2="230" y2="285" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Agent 1: Research -->
      <g transform="translate(230, 250)">
        <rect x="0" y="0" width="160" height="70" class="node-box" fill="#0f172a" stroke="#c084fc" />
        <text x="15" y="30" class="node-title">1. Research Agent</text>
        <text x="15" y="50" class="node-desc">Synthesizes Web Search</text>
      </g>

      <!-- Tool: Tavily -->
      <g transform="translate(230, 130)">
        <rect x="10" y="0" width="140" height="50" class="node-box" fill="#1e1b4b" stroke="#818cf8" stroke-dasharray="4" />
        <text x="25" y="25" class="node-title" fill="#c7d2fe">Tavily Search API</text>
        <text x="25" y="40" class="node-desc">Live Market Data</text>
      </g>
      <line x1="310" y1="250" x2="310" y2="180" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4"/>

      <line x1="390" y1="285" x2="440" y2="285" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Agent 2: Brand Memory -->
      <g transform="translate(440, 250)">
        <rect x="0" y="0" width="160" height="70" class="node-box" fill="#0f172a" stroke="#4ade80" />
        <text x="15" y="30" class="node-title">2. Memory Agent</text>
        <text x="15" y="50" class="node-desc">Retrieves Brand Guidelines</text>
      </g>

      <!-- Tool: Vector DB -->
      <g transform="translate(440, 130)">
        <rect x="10" y="0" width="140" height="50" class="node-box" fill="#064e3b" stroke="#34d399" stroke-dasharray="4" />
        <text x="25" y="25" class="node-title" fill="#a7f3d0">Vector RAG Store</text>
        <text x="25" y="40" class="node-desc">Dense Cosine Search</text>
      </g>
      <line x1="520" y1="250" x2="520" y2="180" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4"/>

      <!-- Flow down to Copywriter -->
      <path d="M 520 320 L 520 370 L 310 370 L 310 430" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Agent 3: Copywriter -->
      <g transform="translate(230, 430)">
        <rect x="0" y="0" width="160" height="70" class="node-box" fill="#0f172a" stroke="#38bdf8" />
        <text x="15" y="30" class="node-title">3. Copywriter Agent</text>
        <text x="15" y="50" class="node-desc">Drafts Copy & Revisions</text>
      </g>

      <line x1="390" y1="465" x2="440" y2="465" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Agent 4: Creative Director -->
      <g transform="translate(440, 430)">
        <rect x="0" y="0" width="160" height="70" class="node-box" fill="#0f172a" stroke="#f472b6" />
        <text x="15" y="30" class="node-title">4. Creative Director</text>
        <text x="15" y="50" class="node-desc">Design & Image Prompt</text>
      </g>

      <line x1="600" y1="465" x2="650" y2="465" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Agent 5: Brand Guardian -->
      <g transform="translate(650, 430)">
        <rect x="0" y="0" width="160" height="70" class="node-box" fill="#0f172a" stroke="#fbbf24" />
        <text x="15" y="30" class="node-title">5. Brand Guardian</text>
        <text x="15" y="50" class="node-desc">Audits & Validates Rules</text>
      </g>

      <!-- Tool: Deterministic Scanner -->
      <g transform="translate(650, 540)">
        <rect x="10" y="0" width="140" height="50" class="node-box" fill="#451a03" stroke="#f59e0b" stroke-dasharray="4" />
        <text x="25" y="25" class="node-title" fill="#fde68a">Banned Term Scan</text>
        <text x="25" y="40" class="node-desc">Deterministic Regex</text>
      </g>
      <line x1="730" y1="500" x2="730" y2="540" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>

      <!-- Verdict / Feedback Loop -->
      <path d="M 730 430 L 730 380 L 310 380 L 310 420" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
      <rect x="470" y="368" width="130" height="24" rx="4" fill="#451a03" stroke="#f59e0b"/>
      <text x="478" y="384" font-size="10" font-weight="bold" fill="#fde68a">🔄 Re-loop if Flagged</text>

      <!-- Output Line (Approved) -->
      <line x1="810" y1="465" x2="860" y2="465" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrow-green)"/>
      <rect x="808" y="445" width="55" height="18" rx="3" fill="#14532d"/>
      <text x="812" y="457" font-size="9" font-weight="bold" fill="#4ade80">Approved</text>

      <!-- Fal.ai & Final Deliverable -->
      <g transform="translate(860, 420)">
        <rect x="0" y="0" width="120" height="90" class="node-box" fill="#14532d" stroke="#22c55e" />
        <text x="12" y="25" class="node-title" fill="#dcfce7">Fal.ai API</text>
        <text x="12" y="45" class="node-desc">+ Multi-Channel</text>
        <text x="12" y="65" class="node-desc">Campaign Card</text>
      </g>
    </svg>
  </div>
</body>
</html>
